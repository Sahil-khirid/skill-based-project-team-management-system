server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ALLOWED_ORIGIN:http://localhost:5173}
                  - ${FRONTEND_ALLOWED_ORIGIN_ALT:http://127.0.0.1:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                allowCredentials: false
                maxAge: 3600
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: user-skill-users
              uri: lb://USER-SKILL-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: user-skill-skills
              uri: lb://USER-SKILL-SERVICE
              predicates:
                - Path=/api/v1/skills/**
            - id: task-progress-summary
              uri: lb://TASK-PROGRESS-SERVICE
              predicates:
                # Must precede project-team-service below: this specific route is a strict
                # subset of that broader /api/v1/projects/** predicate, and Spring Cloud
                # Gateway dispatches on the first matching route in declared list order.
                - Path=/api/v1/projects/*/task-progress-summary
            - id: project-team-service
              uri: lb://PROJECT-TEAM-SERVICE
              predicates:
                - Path=/api/v1/projects/**
            - id: task-progress-tasks
              uri: lb://TASK-PROGRESS-SERVICE
              predicates:
                - Path=/api/v1/tasks/**
          discovery:
            locator:
              # Only the explicit route above is exposed; automatic discovery
              # routes for other registered services stay disabled.
              enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

gateway:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: skillteam-auth-service
      audience: skillteam-api

management:
  endpoints:
    web:
      exposure:
        include: health
