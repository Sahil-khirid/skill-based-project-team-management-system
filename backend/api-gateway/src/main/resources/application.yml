server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
          discovery:
            locator:
              # Only the explicit route above is exposed; automatic discovery
              # routes for other registered services stay disabled.
              enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

gateway:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: skillteam-auth-service
      audience: skillteam-api

management:
  endpoints:
    web:
      exposure:
        include: health
