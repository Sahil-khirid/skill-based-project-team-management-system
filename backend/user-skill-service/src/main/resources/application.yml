server:
  port: 8082

spring:
  application:
    name: USER-SKILL-SERVICE
  datasource:
    url: ${USER_SKILL_DB_URL:jdbc:mysql://localhost:3306/skillteam_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${USER_SKILL_DB_USERNAME:root}
    password: ${USER_SKILL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health
